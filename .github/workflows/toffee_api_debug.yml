name: Scrape with Device Token

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # Checkout
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # Python
      # ==========================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"


      # ==========================================
      # Install Playwright
      # ==========================================

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium


      # ==========================================
      # Check DEVICE_TOKEN
      # ==========================================

      - name: Check Device Token
        env:
          DEVICE_TOKEN: ${{ secrets.DEVICE_TOKEN }}
        run: |
          if [ -z "$DEVICE_TOKEN" ]; then
            echo "ERROR: DEVICE_TOKEN secret is empty or missing."
            exit 1
          fi

          echo "DEVICE_TOKEN is configured."
          echo "Token length: ${#DEVICE_TOKEN}"


      # ==========================================
      # Run scraper
      # ==========================================

      - name: Run scraper
        env:
          DEVICE_TOKEN: ${{ secrets.DEVICE_TOKEN }}
        run: |
          python scraper.py


      # ==========================================
      # Show generated files
      # ==========================================

      - name: List debug output
        if: always()
        run: |
          echo "===== DEBUG DIRECTORY ====="

          if [ -d "debug" ]; then
            find debug -maxdepth 3 -type f -print
          else
            echo "debug directory does not exist."
          fi


      # ==========================================
      # Upload complete debug results
      # ==========================================

      - name: Upload scraper results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stream-data
          path: debug/
          if-no-files-found: warn
          retention-days: 7


      # ==========================================
      # Upload M3U8 files separately
      # ==========================================

      - name: Upload M3U8 files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3u8-files
          path: debug/m3u8_files/
          if-no-files-found: warn
          retention-days: 7
