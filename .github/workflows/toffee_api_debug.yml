name: Scrape with Device Token

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Check Device Token
        env:
          DEVICE_TOKEN: ${{ secrets.DEVICE_TOKEN }}
        run: |
          if [ -z "$DEVICE_TOKEN" ]; then
            echo "ERROR: DEVICE_TOKEN secret is missing."
            exit 1
          fi
          echo "DEVICE_TOKEN is configured."
          echo "Token length: ${#DEVICE_TOKEN}"

      - name: Run scraper
        env:
          DEVICE_TOKEN: ${{ secrets.DEVICE_TOKEN }}
        run: |
          python scraper.py

      - name: List debug output
        if: always()
        run: |
          if [ -d "debug" ]; then
            find debug -maxdepth 3 -type f -print
          else
            echo "No debug directory found."
          fi

      - name: Upload scraper results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stream-data
          path: debug/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload M3U8 files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3u8-files
          path: debug/m3u8_files/
          if-no-files-found: warn
          retention-days: 7
