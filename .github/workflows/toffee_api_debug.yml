name: Scrape with Device Token

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:

      # ==============================
      # Checkout
      # ==============================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==============================
      # Setup Python
      # ==============================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      # ==============================
      # Install Playwright
      # ==============================

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium


      # ==============================
      # Check Device Token
      # ==============================

      - name: Check Device Token
        env:
          DEVICE_TOKEN: ${{ secrets.DEVICE_TOKEN }}
        run: |
          if [ -z "$DEVICE_TOKEN" ]; then
            echo "ERROR: DEVICE_TOKEN secret is missing."
            exit 1
          fi

          echo "DEVICE_TOKEN is configured."
          echo "Token length: ${#DEVICE_TOKEN}"


      # ==============================
      # Run Scraper
      # ==============================

      - name: Run scraper
        env:
          DEVICE_TOKEN: ${{ secrets.DEVICE_TOKEN }}
        run: |
          python scraper.py


      # ==============================
      # List Debug Files
      # ==============================

      - name: List debug output
        if: always()
        run: |
          echo "================================"
          echo "DEBUG OUTPUT"
          echo "================================"

          if [ -d "debug" ]; then
            find debug -maxdepth 3 -type f -print
          else
            echo "No debug directory found."
          fi


      # ==============================
      # Upload Debug Results
      # ==============================

      - name: Upload scraper results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stream-data
          path: debug/
          if-no-files-found: warn
          retention-days: 7


      # ==============================
      # Upload M3U8 Files
      # ==============================

      - name: Upload M3U8 files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3u8-files
          path: debug/m3u8_files/
          if-no-files-found: warn
          retention-days: 7
