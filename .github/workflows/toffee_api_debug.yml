name: Scrape with Device Token

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium
          
      - name: Run scraper
        env:
          DEVICE_TOKEN: ${{ secrets.DEVICE_TOKEN }}
        run: python scraper.py
        
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: stream-data
          path: debug/
          
      - name: Upload m3u8 files
        uses: actions/upload-artifact@v4
        with:
          name: m3u8-files
          path: debug/m3u8_files/
